<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/config.css">
    <link rel="stylesheet" href="css/header.css">
    <title>Breshop</title>
</head>
<body>
    <!-- cabeçalho com os a navegação para outras partes do codigo -->
    <header>
        <div class="container-header">
            <div>
                <image src="assets/logo.svg" alt="logo"/>
            </div>
            <div class="content-header">
                <span>
                    <input type="text" placeholder="Pesquisar...">
                    <button>
                        <img src="assets/lupa.svg" alt="lupa"/>
                    </button>
                </span>
                <nav>
                    <div class="nav-item">
                        <img src="assets/superior.svg" alt="home"/>
                        <a href="#">superior</a>
                    </div>
                    <div class="nav-item">
                        <img src="assets/inferior.svg" alt="inferior"/>
                        <a href="#">inferior</a>
                    </div>
                    <div class="nav-item"> 
                        <img src="assets/fav.svg" alt="contato"/>
                        <a href="#">favoritos</a>
                    </div>
                    <div class="nav-item"> 
                        <img src="assets/carrinho.svg" alt="contato"/>
                        <a href="#">carrinho</a>
                    </div>
                </nav>   
            </div>
            <button class="btn-login">
                Login   
            </button>
        </div>
    </header>
    <main>
        <section>
            <div class="container-slide">

                <nav>
                    <input type="radio" name="slide" id="slide2">
                    <input type="radio" name="slide" id="slide3">
                    <input type="radio" name="slide" id="slide4">
                </nav>
            </div>
        </section>
    </main>
</body>
</html>
